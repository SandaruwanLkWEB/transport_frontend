<!doctype html><html><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ඇතුල්වීම</title>
<link rel="stylesheet" href="assets/styles.css"/>
<script src="assets/config.js"></script>
<script src="assets/app.js"></script>
</head><body>
<div class="topbar"><div class="inner">
<div class="brand"><span class="dot"></span> ප්‍රවාහන පද්ධතිය</div>
<div class="nav"><a class="btn" href="register.html">ලියාපදිංචි වන්න</a></div>
</div></div>
<div class="container">
<h1 class="h1">ඇතුල්වීම</h1>
<div class="grid">
  <div class="card soft">
    <h2 class="h2">ඔබගේ ගිණුමට ඇතුල් වන්න</h2>
    <div id="msg" class="alert error hidden"></div>
    <label>විද්‍යුත් තැපෑල</label>
    <input id="email" type="email" placeholder="name@example.com"/>
    <label>මුරපදය</label>
    <input id="password" type="password" placeholder="••••••••"/>
    <div class="toolbar">
      <div class="btnrow">
        <button class="btn btn-primary" id="btnLogin">ඇතුල් වන්න</button>
      </div>
</span>
    </div>
  </div>
  </div>
</div>
<script>
document.getElementById("btnLogin").onclick = async ()=>{
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const msg = document.getElementById("msg");
  msg.classList.add("hidden");
  try{
    const d = await api("/auth/login", { method:"POST", body: JSON.stringify({ email, password }) });
    setToken(d.token);
    const me = await loadMe();
    const role = me.me && me.me.role;
    if(role==="ADMIN") location.href="admin.html";
    else if(role==="HOD") location.href="hod.html";
    else if(role==="TA") location.href="ta.html";
    else if(role==="HR") location.href="hr.html";
    else if(role==="EMP") location.href="emp.html";
    else location.href="login.html";
  }catch(e){
    msg.textContent = e.message || "අසමත් විය";
    msg.classList.remove("hidden");
  }
};
</script>
</body></html>
