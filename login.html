<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Transport System</title>
    <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <h2 style="text-align: center; color: var(--primary);">පද්ධතියට පිවිසෙන්න</h2>
            <p style="text-align: center; color: var(--text-muted); margin-bottom: 30px;">ඔබගේ විස්තර ඇතුලත් කරන්න</p>
            
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>විද්‍යුත් තැපෑල (Email)</label>
                    <input type="email" id="email" placeholder="user@company.lk" required>
                </div>
                <div class="form-group">
                    <label>මුරපදය (Password)</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn w-100">පිවිසෙන්න</button>
            </form>

            <div style="margin-top: 20px; text-align: center; font-size: 0.9rem;">
                ගිණුමක් නැද්ද? <a href="register.html" style="color: var(--primary);">ලියාපදිංචි වන්න</a>
            </div>
        </div>
    </div>

    <script src="assets/config.js"></script>
    <script src="assets/app.js"></script>
    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const data = await api("/auth/login", {
                    method: "POST",
                    body: JSON.stringify({ email, password })
                });
                
                setToken(data.token);
                
                // Role based redirect
                const roleMap = { 
                    "ADMIN": "admin.html", 
                    "HOD": "hod.html", 
                    "HR": "hr.html", 
                    "TA": "ta.html", 
                    "EMP": "emp.html" 
                };
                window.location.href = roleMap[data.role] || "index.html";
            } catch (err) {
                // Error is handled by api wrapper toast
            }
        }
    </script>
</body>
</html>
