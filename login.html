<div class="topbar"><div class="inner">
<div class="brand"><span class="dot"></span> ප්‍රවාහන පද්ධතිය</div>

</div></div>
<div class="container">
<h1 class="h1">ඇතුල්වීම</h1>
<div class="grid">
  <div class="card soft">
    <h2 class="h2">ඔබගේ ගිණුමට ඇතුල් වන්න</h2>

    <label>විද්‍යුත් තැපෑල</label>
    <input id="email" type="email" placeholder="name@example.com"/>
    <label>මුරපදය</label>
    <input id="password" type="password" placeholder="••••••••"/>
    <div class="toolbar">
      <div class="btnrow">
        <button class="btn btn-primary" id="btnLogin">ඇතුල් වන්න</button>
      </div></div>
  </div>
</div>
<script src="assets/pages/login.page.js"></script>
