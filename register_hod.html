<!DOCTYPE html>
<!doctype html><html><head>
<meta name="robots" content="noindex,nofollow" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://transport-production-e5c7.up.railway.app https://laveback-production.up.railway.app; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests" />
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>HOD ලියාපදිංචි වීම</title>
<link rel="stylesheet" href="assets/styles.css"/>
<script src="assets/config.js"></script>
<script src="assets/app.js"></script>
</head><body>
<div class="topbar"><div class="inner">
<div class="brand"><span class="dot"></span> ප්‍රවාහන පද්ධතිය</div>
<div class="nav"><a class="btn btn-ghost" href="login.html">ඇතුල්වීම</a><a class="btn" href="register.html">ආපසු</a></div>
</div></div>
<div class="container">
<h1 class="h1">HOD ලියාපදිංචි වීම</h1>
<div class="card soft">
  <div class="grid two">
    <div>
      <label>නම</label>
      <input id="hod_name" placeholder="නම"/>
      <label>සේවක අංකය (Emp No)</label>
      <input id="emp_no" placeholder="උදා: 01502"/>
      <label>විද්‍යුත් තැපෑල</label>
      <input id="email" type="email" placeholder="name@example.com"/>
    </div>
    <div>
      <label>දෙපාර්තමේන්තුව</label>
      <select id="department_id"></select>
      <label>මුරපදය</label>
      <input id="password" type="password" placeholder="අවම අකුරු 6"/>
      <div class="toolbar">
        <div class="btnrow"><button class="btn btn-primary" id="btnReg">යොමු කරන්න</button></div>
      </div>
      <div id="msg" class="alert hidden"></div>
    </div>
  </div>
</div>
</div>
<script src="assets/pages/register_hod.page.js"></script>
</body></html>
