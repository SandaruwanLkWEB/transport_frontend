<!DOCTYPE html>
<!doctype html>
<html>
<head>
  <meta name="robots" content="noindex,nofollow" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://transport-production-e5c7.up.railway.app https://laveback-production.up.railway.app; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests" />
<meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>මානව සම්පත් (HR)</title>
  <link rel="stylesheet" href="assets/styles.css" />
  <script src="assets/config.js"></script>
  <script src="assets/app.js"></script>
</head>
<body>
<header>
  <h1>මානව සම්පත් (HR)</h1>
  <div style="display:flex; gap:8px; align-items:center;">
    <a href="index.html">මුල් පිටුව</a>
    <button class="btn secondary small" onclick="logout()">ඉවත් වන්න</button>
  </div>
</header>

<div class="container">
  <div class="card" id="meBox"></div>

  <div class="card">
    <div class="tabs">
      <button class="btn active" id="tabApprove" onclick="setTab('approve')">අවසන් අනුමැතිය</button>
      <button class="btn" id="tabReports" onclick="setTab('reports')">වාර්තා</button>
    </div>
  </div>

  <div class="card" id="pane_approve">
    <h2 style="margin:0 0 10px;">TA Assigned ඉල්ලීම්</h2>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      <button class="btn ghost" onclick="loadTAඉල්ලීම්()">Refresh</button>
    </div>
    <div class="hr"></div>
    <div id="listBox" class="small">Loading...</div>
  </div>

  <div class="card" id="pane_reports" style="display:none;">
    <h2 style="margin:0 0 10px;">බාගත කරන්න Reports</h2>
    <div class="small">Reports download කරන්නේ HR Final Approval පස්සේම.</div>
    <div class="row">
      <div>
        <label>දිනය</label>
        <input id="repDate" type="date" type="number" placeholder="e.g. 12" />
      </div>
      <div>
        <label>Actions</label>
        <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:6px;">
          <button class="btn" onclick="downloadRouteReport()">Route-wise PDF</button>
          <button class="btn secondary" onclick="downloadVehicleReport()">Vehicle PDF</button>
        </div>
      </div>
    </div>
  </div>

</div>

<script src="assets/pages/hr.page.js"></script>
</body>
</html>
