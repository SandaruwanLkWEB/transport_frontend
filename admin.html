<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
    <div class="app-container">
        <div class="sidebar">
            <div class="brand">🚀 TransportSys</div>
            <a href="#" class="nav-item active" onclick="showSection('approvals')">🏠 අනුමත කිරීම්</a>
            <a href="#" class="nav-item" onclick="showSection('master')">🛠 මූලික දත්ත</a>
            <a href="#" class="nav-item" onclick="showSection('reports')">📄 වාර්තා</a>
            <div style="margin-top: 20px; border-top: 1px solid #eee; padding-top: 10px;">
                <a href="#" class="nav-item logout" onclick="logout()">🚪 පිටවන්න</a>
            </div>
        </div>

        <div class="main-content">
            <header class="flex-between">
                <h1>පරිපාලක පුවරුව</h1>
                <div id="user-display" class="badge DRAFT">Admin</div>
            </header>

            <div id="sec-approvals">
                <div class="card">
                    <div class="flex-between">
                        <h3>ඉල්ලීම් ලැයිස්තුව</h3>
                        <button class="btn secondary small" onclick="loadRequests()">🔄 Refresh</button>
                    </div>
                    <div class="table-responsive">
                        <table id="req-table">
                            <thead>
                                <tr><th>ID</th><th>දිනය</th><th>දෙපාර්තමේන්තුව</th><th>තත්ත්වය</th><th>ක්‍රියාව</th></tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div id="sec-master" class="hidden">
                <div class="card">
                    <h3>දෙපාර්තමේන්තු කළමනාකරණය</h3>
                    <div class="form-group" style="display:flex; gap:10px;">
                        <input id="newDepName" placeholder="New Department Name">
                        <button class="btn" onclick="addDept()">Add</button>
                    </div>
                    <div id="dept-list"></div>
                </div>
            </div>

             <div id="sec-reports" class="hidden">
                <div class="card">
                    <h3>වාර්තා බාගත කරන්න</h3>
                    <p class="text-muted">අවසාන අනුමැතිය (HR Final Approved) ලැබුණු ඉල්ලීම් සඳහා පමණයි.</p>
                    <input id="repReqId" type="number" placeholder="Request ID e.g. 15">
                    <br><br>
                    <button class="btn" onclick="downloadPdf('route')">Route Report</button>
                    <button class="btn secondary" onclick="downloadPdf('vehicle')">Vehicle Report</button>
                </div>
            </div>

        </div>
    </div>

    <script src="assets/config.js"></script>
    <script src="assets/app.js"></script>
    <script>
        // --- Page Specific Logic ---
        
        // 1. Navigation Handling
        function showSection(id) {
            document.querySelectorAll('[id^="sec-"]').forEach(el => el.classList.add('hidden'));
            document.getElementById(`sec-${id}`).classList.remove('hidden');
            
            // Update Sidebar Active State
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            event.target.classList.add('active');
        }

        // 2. Load Data
        async function loadRequests() {
            try {
                const d = await api("/admin/requests");
                const tbody = document.querySelector("#req-table tbody");
                tbody.innerHTML = d.requests.map(r => `
                    <tr>
                        <td>#${r.id}</td>
                        <td>${fmtDate(r.request_date)} <small>(${fmtTime(r.request_time)})</small></td>
                        <td>${r.department_name}</td>
                        <td><span class="badge ${r.status}">${r.status}</span></td>
                        <td>
                            ${r.status === 'SUBMITTED' ? 
                            `<button class="btn small" onclick="approve(${r.id})">Approve</button>` : 
                            `<button class="btn small secondary" disabled>View</button>`}
                        </td>
                    </tr>
                `).join('');
            } catch (e) {}
        }

        async function approve(id) {
            if(!confirm("Are you sure?")) return;
            await api(`/admin/requests/${id}/approve`, { method: "POST" });
            showToast("ඉල්ලීම අනුමත කරන ලදී", "success");
            loadRequests();
        }

        async function addDept() {
            const name = qs("#newDepName").value;
            if(!name) return;
            await api("/admin/departments", { method: "POST", body: JSON.stringify({name}) });
            showToast("Department Added");
            qs("#newDepName").value = "";
        }
        
        function downloadPdf(type) {
             const id = qs("#repReqId").value;
             if(!id) return showToast("ID එක ඇතුලත් කරන්න");
             const endpoint = type === 'route' ? 'route-wise' : 'vehicle';
             window.open(`${API_BASE_URL}/reports/${endpoint}?request_id=${id}`, '_blank');
        }

        // 3. Init
        (async () => {
            const me = await checkAuth("ADMIN");
            if(me) {
                loadRequests();
                // Load other initial data...
            }
        })();
    </script>
</body>
</html>
